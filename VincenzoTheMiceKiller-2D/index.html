<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat & Mouse Catch!</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            /* SVG Cat Cursor: Cat face with pointed ears and whiskers */
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36"><circle cx="18" cy="20" r="12" fill="%23f39c12"/><polygon points="8,12 12,2 17,10" fill="%23f39c12"/><polygon points="28,12 24,2 19,10" fill="%23f39c12"/><polygon points="10,10 12,4 15,9" fill="%23e67e22"/><polygon points="26,10 24,4 21,9" fill="%23e67e22"/><circle cx="13" cy="18" r="2" fill="%232c3e50"/><circle cx="23" cy="18" r="2" fill="%232c3e50"/><polygon points="18,21 16,23 20,23" fill="%23e74c3c"/><line x1="6" y1="20" x2="12" y2="21" stroke="%232c3e50" stroke-width="1.5"/><line x1="6" y1="23" x2="12" y2="23" stroke="%232c3e50" stroke-width="1.5"/><line x1="30" y1="20" x2="24" y2="21" stroke="%232c3e50" stroke-width="1.5"/><line x1="30" y1="23" x2="24" y2="23" stroke="%232c3e50" stroke-width="1.5"/></svg>') 18 18, auto;
        }

        #game-container {
            width: 800px;
            height: 600px;
            background-color: #a8e6cf;
            border: 6px solid #34495e;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        #ui-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            font-size: 22px;
            font-weight: bold;
            color: #2d3436;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(5px);
            z-index: 5;
        }

        .mouse {
            position: absolute;
            width: 50px;
            height: 50px;
            /* SVG Mouse */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50"><ellipse cx="25" cy="28" rx="16" ry="12" fill="%237f8c8d"/><circle cx="15" cy="18" r="6" fill="%23ff7979"/><circle cx="15" cy="18" r="4" fill="%23badc58"/><circle cx="35" cy="18" r="6" fill="%23ff7979"/><circle cx="35" cy="18" r="4" fill="%23badc58"/><circle cx="21" cy="26" r="2" fill="%23000"/><circle cx="29" cy="26" r="2" fill="%23000"/><ellipse cx="25" cy="31" rx="2.5" ry="1.5" fill="%23ff7979"/><path d="M 25 38 Q 20 48 10 45" stroke="%237f8c8d" stroke-width="3" fill="none"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            /* Cat cursor style preserved over targets */
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36"><circle cx="18" cy="20" r="12" fill="%23f39c12"/><polygon points="8,12 12,2 17,10" fill="%23f39c12"/><polygon points="28,12 24,2 19,10" fill="%23f39c12"/><polygon points="10,10 12,4 15,9" fill="%23e67e22"/><polygon points="26,10 24,4 21,9" fill="%23e67e22"/><circle cx="13" cy="18" r="2" fill="%232c3e50"/><circle cx="23" cy="18" r="2" fill="%232c3e50"/><polygon points="18,21 16,23 20,23" fill="%23e74c3c"/><line x1="6" y1="20" x2="12" y2="21" stroke="%232c3e50" stroke-width="1.5"/><line x1="6" y1="23" x2="12" y2="23" stroke="%232c3e50" stroke-width="1.5"/><line x1="30" y1="20" x2="24" y2="21" stroke="%232c3e50" stroke-width="1.5"/><line x1="30" y1="23" x2="24" y2="23" stroke="%232c3e50" stroke-width="1.5"/></svg>') 18 18, auto;
            animation: popIn 0.15s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 62, 80, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 10;
        }

        #overlay h1 {
            font-size: 48px;
            margin-bottom: 10px;
            color: #f1c40f;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #overlay p {
            font-size: 20px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 15px 35px;
            font-size: 22px;
            font-weight: bold;
            color: white;
            background-color: #e67e22;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn:hover {
            background-color: #d35400;
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-bar">
            <div>Score: <span id="score">0</span></div>
            <div>Time: <span id="timer">30</span>s</div>
        </div>

        <div id="overlay">
            <h1 id="overlay-title">Cat & Mouse Catch!</h1>
            <p id="overlay-msg">Catch as many mice as you can before time runs out!</p>
            <button class="btn" id="start-btn" onclick="startGame()">Start Game</button>
        </div>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayMsg = document.getElementById('overlay-msg');
        const startBtn = document.getElementById('start-btn');

        let score = 0;
        let timeLeft = 30;
        let gameInterval = null;
        let mouseSpawnTimeout = null;
        let activeMouse = null;
        let activeMouseTimeout = null;

        function startGame() {
            score = 0;
            timeLeft = 30;
            scoreEl.textContent = score;
            timerEl.textContent = timeLeft;
            overlay.style.display = 'none';

            // Start countdown timer
            gameInterval = setInterval(updateTimer, 1000);
            
            // Spawn the first mouse
            spawnMouse();
        }

        function updateTimer() {
            timeLeft--;
            timerEl.textContent = timeLeft;

            if (timeLeft <= 0) {
                endGame();
            }
        }

        function spawnMouse() {
            if (timeLeft <= 0) return;

            // Remove existing mouse if present
            removeCurrentMouse();

            const mouse = document.createElement('div');
            mouse.className = 'mouse';

            // Calculate random positions within container bounds
            // Margin offset: UI bar (60px) and padding around edges
            const padding = 20;
            const topMin = 70;
            const topMax = container.clientHeight - 50 - padding;
            const leftMin = padding;
            const leftMax = container.clientWidth - 50 - padding;

            const randomTop = Math.floor(Math.random() * (topMax - topMin)) + topMin;
            const randomLeft = Math.floor(Math.random() * (leftMax - leftMin)) + leftMin;

            mouse.style.top = `${randomTop}px`;
            mouse.style.left = `${randomLeft}px`;

            // On mouse click
            mouse.addEventListener('mousedown', (e) => {
                e.stopPropagation();
                score++;
                scoreEl.textContent = score;
                removeCurrentMouse();
                
                // Schedule next mouse spawn with a small random delay
                clearTimeout(mouseSpawnTimeout);
                mouseSpawnTimeout = setTimeout(spawnMouse, Math.random() * 300 + 100);
            });

            container.appendChild(mouse);
            activeMouse = mouse;

            // Mouse disappears on its own after 700ms - 1200ms if not clicked
            const visibleDuration = Math.floor(Math.random() * 500) + 700;
            activeMouseTimeout = setTimeout(() => {
                removeCurrentMouse();
                mouseSpawnTimeout = setTimeout(spawnMouse, Math.random() * 400 + 200);
            }, visibleDuration);
        }

        function removeCurrentMouse() {
            if (activeMouseTimeout) {
                clearTimeout(activeMouseTimeout);
                activeMouseTimeout = null;
            }
            if (activeMouse && activeMouse.parentNode) {
                activeMouse.parentNode.removeChild(activeMouse);
                activeMouse = null;
            }
        }

        function endGame() {
            clearInterval(gameInterval);
            clearTimeout(mouseSpawnTimeout);
            removeCurrentMouse();

            overlayTitle.textContent = "Time's Up!";
            overlayMsg.textContent = `You caught ${score} mice!`;
            startBtn.textContent = "Play Again";
            overlay.style.display = 'flex';
        }
    </script>
</body>
</html>
